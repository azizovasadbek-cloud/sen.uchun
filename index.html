<!DOCTYPE html>
<html lang="uz">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SafeStream</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


    <!-- ==============================
         NAVBAR
    =============================== -->

    <header class="navbar">

        <div class="logo">

            <span class="logo-icon">
                ▶
            </span>

            SafeStream

        </div>


        <div class="status">

            <span class="status-dot"></span>

            Secure

        </div>

    </header>



    <!-- ==============================
         MAIN
    =============================== -->

    <main class="container">


        <!-- HERO -->

        <section class="hero">


            <div class="hero-badge">

                🔒 Private video

            </div>


            <h1>

                Faqat sen uchun

            </h1>


            <p class="description">

                Bu kichik sahifa aynan sen uchun tayyorlandi.
                Senga atalgan maxsus video shu yerda.

            </p>


            <button
                class="open-button"
                onclick="showVideo()">

                <span>
                    ▶
                </span>

                Videoni ochish

            </button>


        </section>



        <!-- ==============================
             VIDEO
        =============================== -->

        <section
            id="videoBox"
            class="video-section">


            <div class="video-header">


                <div>

                    <span class="video-label">

                        PRIVATE VIDEO

                    </span>


                    <h2>

                        Senga atalgan video

                    </h2>

                </div>


                <span class="secure-label">

                    🔐 Secure

                </span>


            </div>



            <!-- VIDEO PLAYER -->

            <div class="video-wrapper">


                <video
                    id="mainVideo"
                    controls
                    playsinline
                    preload="metadata">


                    <source
                        id="videoSource"
                        src="video.mp4"
                        type="video/mp4">


                    Brauzeringiz videoni
                    qo‘llab-quvvatlamaydi.


                </video>


            </div>



            <p class="video-note">

                Ushbu video faqat siz uchun
                tayyorlangan.

            </p>


        </section>


    </main>



    <!-- ==============================
         FOOTER
    =============================== -->

    <footer>

        <span>
            SafeStream
        </span>

        <span>
            •
        </span>

        <span>
            Private & Secure
        </span>

    </footer>



    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script>


        /*
        ==========================================
        VIDEO ID
        ==========================================
        */

        const params =
            new URLSearchParams(
                window.location.search
            );


        /*
        ==========================================
        UNIQUE VIDEO ID
        ==========================================
        */

        const videoId =
            params.get("video") || "abc123";



        /*
        ==========================================
        VIDEO DATABASE
        ==========================================
        */

        const videos = {

            "abc123": "video.mp4"

        };



        /*
        ==========================================
        FIND VIDEO
        ==========================================
        */

        const videoFile =
            videos[videoId];


        const videoSource =
            document.getElementById(
                "videoSource"
            );



        /*
        ==========================================
        LOAD VIDEO
        ==========================================
        */

        if (videoFile) {

            videoSource.src =
                videoFile;


            document
                .getElementById("mainVideo")
                .load();

        }



        /*
        ==========================================
        SHOW VIDEO
        ==========================================
        */

        function showVideo() {


            const videoBox =
                document.getElementById(
                    "videoBox"
                );


            videoBox.classList.add(
                "visible"
            );


            /*
            Scroll to video
            */

            setTimeout(() => {

                videoBox.scrollIntoView({

                    behavior: "smooth",

                    block: "center"

                });

            }, 100);


        }


    </script>


</body>

</html>
