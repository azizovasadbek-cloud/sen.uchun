<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SafeStream Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#080b12;
    color:#fff;
}

.navbar{
    height:72px;
    padding:0 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#0d111b;
    border-bottom:1px solid #202636;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.status{
    color:#9aa8c0;
    font-size:15px;
}

.dot{
    display:inline-block;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#22c55e;
    margin-right:7px;
}

.container{
    width:min(850px,94%);
    margin:35px auto;
}

.card{
    background:#101621;
    border:1px solid #222b3d;
    border-radius:22px;
    padding:28px;
    margin-bottom:25px;
}

h1{
    margin:0 0 8px;
    font-size:30px;
}

h2{
    margin-top:0;
}

.description{
    color:#8994a8;
    line-height:1.6;
}

label{
    display:block;
    color:#b9c3d6;
    margin:18px 0 8px;
}

input,
select{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #30394d;
    background:#080c14;
    color:#fff;
    font-size:15px;
}

input[type=file]{
    padding:12px;
}

button{
    border:0;
    border-radius:12px;
    padding:14px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.primary{
    width:100%;
    background:#2563eb;
    color:white;
    margin-top:20px;
}

.secondary{
    background:#202a3c;
    color:#fff;
}

.danger{
    background:#7f1d1d;
    color:#fff;
}

.hidden{
    display:none !important;
}

.message{
    margin-top:15px;
    padding:14px;
    border-radius:12px;
    background:#172033;
    color:#9eb2d7;
    line-height:1.5;
}

.success{
    background:#10281d;
    color:#6ee7a1;
}

.error{
    background:#32161a;
    color:#ff8c97;
}

.progress{
    margin-top:15px;
    height:9px;
    background:#20283a;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#2563eb;
    transition:width .2s;
}

.admin-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.admin-email{
    color:#8da2c8;
    font-size:13px;
}

.result{
    margin-top:28px;
    border-top:1px solid #20283a;
    padding-top:28px;
}

.code-box{
    text-align:center;
    padding:25px;
    background:#080c14;
    border:1px solid #30394d;
    border-radius:16px;
}

.code{
    font-size:36px;
    letter-spacing:8px;
    font-weight:bold;
    color:#60a5fa;
    margin:15px 0;
}

.expiry{
    color:#8da2c8;
    font-size:13px;
}

.link{
    margin-top:18px;
    padding:14px;
    background:#080c14;
    border:1px solid #30394d;
    border-radius:12px;
    color:#9db4df;
    word-break:break-all;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

.buttons button{
    flex:1;
    min-width:150px;
}

.qr{
    margin-top:25px;
    text-align:center;
}

#qrcode{
    display:inline-block;
    background:#fff;
    padding:15px;
    border-radius:15px;
}

.small{
    color:#77839a;
    font-size:13px;
    margin-top:8px;
}

.file-info{
    margin-top:10px;
    padding:12px;
    background:#0b1019;
    border-radius:10px;
    color:#8da2c8;
    font-size:13px;
}

footer{
    text-align:center;
    color:#667085;
    padding:30px;
    font-size:13px;
}

@media(max-width:600px){

    .card{
        padding:22px;
    }

    .admin-head{
        align-items:flex-start;
        flex-direction:column;
    }

    .code{
        font-size:28px;
        letter-spacing:5px;
    }
}
</style>
</head>

<body>

<header class="navbar">

    <div class="logo">
        ▶️ SafeStream Admin
    </div>

    <div class="status">
        <span class="dot"></span>
        Admin
    </div>

</header>


<main class="container">


<!-- LOGIN -->

<section id="loginCard" class="card">

    <h1>🔐 Admin kirish</h1>

    <p class="description">
        SafeStream videolarini boshqarish uchun
        administrator sifatida kiring.
    </p>

    <label>Email</label>

    <input
        id="email"
        type="email"
        placeholder="admin@example.com"
        autocomplete="username"
    >

    <label>Parol</label>

    <input
        id="password"
        type="password"
        placeholder="Parolingiz"
        autocomplete="current-password"
    >

    <button id="loginButton" class="primary">
        🔐 Admin sifatida kirish
    </button>

    <div id="loginMessage" class="message hidden"></div>

</section>



<!-- ADMIN -->

<section id="adminCard" class="card hidden">

    <div class="admin-head">

        <div>
            <h2>🎬 SafeStream Admin Panel</h2>

            <div id="adminEmail" class="admin-email"></div>
        </div>

        <button id="logoutButton" class="danger">
            🚪 Chiqish
        </button>

    </div>


    <hr style="border-color:#20283a;margin:25px 0;">


    <h3>📤 Yangi video</h3>

    <label>Video nomi</label>

    <input
        id="videoTitle"
        type="text"
        placeholder="Masalan: Tug'ilgan kun videosi"
    >


    <label>MP4 video</label>

    <input
        id="videoFile"
        type="file"
        accept="video/mp4,.mp4"
    >

    <div class="small">
        Faqat MP4. Maksimal hajm: 50 MB.
    </div>

    <div id="fileInfo" class="file-info hidden"></div>


    <label>Kodning amal qilish muddati</label>

    <select id="expiry">

        <option value="5">5 daqiqa</option>
        <option value="10">10 daqiqa</option>
        <option value="15">15 daqiqa</option>
        <option value="30" selected>30 daqiqa</option>
        <option value="60">1 soat</option>
        <option value="120">2 soat</option>
        <option value="1440">24 soat</option>

    </select>


    <button
        id="uploadButton"
        class="primary"
    >
        ⬆️ Video yuklash
    </button>


    <div
        id="progress"
        class="progress hidden"
    >
        <div
            id="progressBar"
            class="progress-bar"
        ></div>
    </div>


    <div
        id="uploadMessage"
        class="message hidden"
    ></div>



    <!-- RESULT -->

    <div
        id="result"
        class="result hidden"
    >

        <h3>✅ Video tayyor</h3>


        <div class="code-box">

            <div>🔑 Bir martalik kod</div>

            <div
                id="generatedCode"
                class="code"
            ></div>

            <div
                id="generatedExpiry"
                class="expiry"
            ></div>

        </div>


        <div
            id="generatedLink"
            class="link"
        ></div>


        <div class="buttons">

            <button
                id="copyLink"
                class="secondary"
            >
                📋 Linkni nusxalash
            </button>

            <button
                id="copyCode"
                class="secondary"
            >
                🔑 Kodni nusxalash
            </button>

            <button
                id="shareButton"
                class="secondary"
            >
                📤 Ulashish
            </button>

        </div>


        <div class="buttons">

            <button
                id="openButton"
                class="secondary"
            >
                ▶️ Video sahifasini ochish
            </button>

            <button
                id="downloadQR"
                class="secondary"
            >
                📱 QR kodni saqlash
            </button>

        </div>


        <div class="qr">

            <p>📱 QR kod</p>

            <div id="qrcode"></div>

        </div>

    </div>

</section>

</main>


<footer>
    SafeStream Admin • Private & Secure
</footer>



<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://kvwcvlwpdsixpbftoalh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_JyI5Zj_1ScRJ2-YEwdSDGg_eaTFvZuD";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==========================================
   SETTINGS
========================================== */

const ADMIN_EMAIL =
"azizovasadbek@icloud.com";

const MAX_SIZE =
50 * 1024 * 1024;

const BUCKET =
"videos";


/* ==========================================
   ELEMENTS
========================================== */

const loginCard =
document.getElementById("loginCard");

const adminCard =
document.getElementById("adminCard");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const loginMessage =
document.getElementById("loginMessage");

const logoutButton =
document.getElementById("logoutButton");

const adminEmail =
document.getElementById("adminEmail");

const videoTitle =
document.getElementById("videoTitle");

const videoFile =
document.getElementById("videoFile");

const fileInfo =
document.getElementById("fileInfo");

const expiry =
document.getElementById("expiry");

const uploadButton =
document.getElementById("uploadButton");

const progress =
document.getElementById("progress");

const progressBar =
document.getElementById("progressBar");

const uploadMessage =
document.getElementById("uploadMessage");

const result =
document.getElementById("result");

const generatedCode =
document.getElementById("generatedCode");

const generatedExpiry =
document.getElementById("generatedExpiry");

const generatedLink =
document.getElementById("generatedLink");

const qrcode =
document.getElementById("qrcode");

const copyLink =
document.getElementById("copyLink");

const copyCode =
document.getElementById("copyCode");

const shareButton =
document.getElementById("shareButton");

const openButton =
document.getElementById("openButton");

const downloadQR =
document.getElementById("downloadQR");


/* ==========================================
   MESSAGE
========================================== */

function message(element,text,type=""){

    element.textContent = text;

    element.className =
        "message " + type;

    element.classList.remove("hidden");
}


/* ==========================================
   DATE
========================================== */

function formatDate(date){

    return new Intl.DateTimeFormat(
        "uz-UZ",
        {
            dateStyle:"medium",
            timeStyle:"short"
        }
    ).format(date);

}


/* ==========================================
   CODE
========================================== */

function generateCode(){

    const arr =
        new Uint32Array(1);

    crypto.getRandomValues(arr);

    return String(
        arr[0] % 100000000
    ).padStart(8,"0");

}


/* ==========================================
   FILE
========================================== */

videoFile.addEventListener(
    "change",
    ()=>{

        const file =
            videoFile.files[0];

        if(!file){

            fileInfo.classList.add("hidden");

            return;
        }

        const sizeMB =
            (file.size / 1024 / 1024)
            .toFixed(2);

        fileInfo.textContent =
            "📄 " +
            file.name +
            " • " +
            sizeMB +
            " MB";

        fileInfo.classList.remove(
            "hidden"
        );

    }
);


/* ==========================================
   LOGIN
========================================== */

loginButton.addEventListener(
    "click",
    async ()=>{

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        if(!email || !password){

            message(
                loginMessage,
                "Email va parolni kiriting.",
                "error"
            );

            return;
        }

        loginButton.disabled = true;

        loginButton.textContent =
            "⏳ Kirilmoqda...";

        try{

            const {
                data,
                error
            } =
            await supabaseClient.auth
                .signInWithPassword({
                    email,
                    password
                });

            if(error)
                throw error;

            await checkAdmin(
                data.user
            );

        }
        catch(error){

            console.error(error);

            message(
                loginMessage,
                "Kirishda xatolik: " +
                error.message,
                "error"
            );

        }
        finally{

            loginButton.disabled = false;

            loginButton.textContent =
                "🔐 Admin sifatida kirish";

        }

    }
);


/* ==========================================
   CHECK ADMIN
========================================== */

async function checkAdmin(user){

    if(!user){

        showLogin();

        return;
    }

    const userEmail =
        user.email?.toLowerCase();

    if(
        userEmail !==
        ADMIN_EMAIL.toLowerCase()
    ){

        await supabaseClient.auth.signOut();

        message(
            loginMessage,
            "Bu hisob administrator emas.",
            "error"
        );

        return;
    }

    loginCard.classList.add("hidden");

    adminCard.classList.remove("hidden");

    adminEmail.textContent =
        "👤 " + user.email;

}


/* ==========================================
   SHOW LOGIN
========================================== */

function showLogin(){

    adminCard.classList.add("hidden");

    loginCard.classList.remove("hidden");

}


/* ==========================================
   LOGOUT
========================================== */

logoutButton.addEventListener(
    "click",
    async ()=>{

        await supabaseClient.auth.signOut();

        showLogin();

    }
);


/* ==========================================
   UPLOAD
========================================== */

uploadButton.addEventListener(
    "click",
    async ()=>{

        const title =
            videoTitle.value.trim();

        const file =
            videoFile.files[0];

        const minutes =
            Number(expiry.value);


        if(!title){

            message(
                uploadMessage,
                "Video nomini kiriting.",
                "error"
            );

            return;
        }


        if(!file){

            message(
                uploadMessage,
                "MP4 video tanlang.",
                "error"
            );

            return;
        }


        if(
            file.type !== "video/mp4" &&
            !file.name.toLowerCase().endsWith(".mp4")
        ){

            message(
                uploadMessage,
                "Faqat MP4 video yuklash mumkin.",
                "error"
            );

            return;
        }


        if(file.size > MAX_SIZE){

            message(
                uploadMessage,
                "Video 50 MB dan katta.",
                "error"
            );

            return;
        }


        const {
            data:userData,
            error:userError
        } =
        await supabaseClient.auth.getUser();


        if(userError || !userData.user){

            message(
                uploadMessage,
                "Admin sessiyasi topilmadi. Qayta kiring.",
                "error"
            );

            return;
        }


        if(
            userData.user.email?.toLowerCase()
            !==
            ADMIN_EMAIL.toLowerCase()
        ){

            message(
                uploadMessage,
                "Administrator huquqi yo‘q.",
                "error"
            );

            return;
        }


        uploadButton.disabled = true;

        progress.classList.remove("hidden");

        progressBar.style.width = "5%";


        try{

            /*
              VIDEO ID
            */

            const videoId =
                crypto.randomUUID();


            /*
              ACCESS CODE
            */

            const accessCode =
                generateCode();


            /*
              EXPIRY
            */

            const expiresAt =
                new Date(
                    Date.now() +
                    minutes * 60 * 1000
                );


            /*
              FILE PATH

              Faqat MP4 ishlatiladi.
            */

            const filePath =
                videoId + ".mp4";


            /*
              STORAGE
            */

            progressBar.style.width = "15%";


            const {
                error:storageError
            } =
            await supabaseClient.storage
                .from(BUCKET)
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl:"3600",
                        upsert:false,
                        contentType:"video/mp4"
                    }
                );


            if(storageError){

                throw new Error(
                    "Storage yuklash xatosi: " +
                    storageError.message
                );
            }


            progressBar.style.width = "65%";


            /*
              DATABASE
            */

            const {
                error:dbError
            } =
            await supabaseClient
                .from("videos")
                .insert({

                    id:videoId,

                    title:title,

                    file_path:filePath,

                    access_code:accessCode,

                    access_code_expires_at:
                        expiresAt.toISOString(),

                    access_code_used:false

                });


            if(dbError){

                /*
                  Database ishlamasa,
                  yuklangan faylni o‘chiramiz.
                */

                await supabaseClient.storage
                    .from(BUCKET)
                    .remove([
                        filePath
                    ]);

                throw new Error(
                    "Database xatosi: " +
                    dbError.message
                );
            }


            progressBar.style.width = "100%";


            /*
              PUBLIC LINK
            */

            const publicLink =
                window.location.origin +
                window.location.pathname
                    .replace(
                        "admin.html",
                        "index.html"
                    ) +
                "?video=" +
                encodeURIComponent(
                    videoId
                );


            /*
              RESULT
            */

            generatedCode.textContent =
                accessCode;

            generatedExpiry.textContent =
                "Amal qilish muddati: " +
                formatDate(expiresAt);

            generatedLink.textContent =
                publicLink;


            /*
              QR
            */

            qrcode.innerHTML = "";

            new QRCode(
                qrcode,
                {
                    text:publicLink,
                    width:260,
                    height:260,
                    correctLevel:
                        QRCode.CorrectLevel.H
                }
            );


            result.classList.remove(
                "hidden"
            );


            message(
                uploadMessage,
                "✅ Video muvaffaqiyatli yuklandi!",
                "success"
            );


            /*
              FORM TOZALASH
            */

            videoTitle.value = "";

            videoFile.value = "";

            fileInfo.classList.add(
                "hidden"
            );


            result.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });

        }
        catch(error){

            console.error(error);

            message(
                uploadMessage,
                "❌ " + error.message,
                "error"
            );

        }
        finally{

            uploadButton.disabled = false;

            setTimeout(
                ()=>{
                    progress.classList.add(
                        "hidden"
                    );

                    progressBar.style.width =
                        "0%";
                },
                1000
            );

        }

    }
);


/* ==========================================
   COPY LINK
========================================== */

copyLink.addEventListener(
    "click",
    async ()=>{

        const link =
            generatedLink.textContent;

        try{

            await navigator.clipboard
                .writeText(link);

            copyLink.textContent =
                "✅ Nusxalandi";

            setTimeout(
                ()=>{
                    copyLink.textContent =
                        "📋 Linkni nusxalash";
                },
                2000
            );

        }
        catch{

            alert(link);

        }

    }
);


/* ==========================================
   COPY CODE
========================================== */

copyCode.addEventListener(
    "click",
    async ()=>{

        const code =
            generatedCode.textContent;

        try{

            await navigator.clipboard
                .writeText(code);

            copyCode.textContent =
                "✅ Nusxalandi";

            setTimeout(
                ()=>{
                    copyCode.textContent =
                        "🔑 Kodni nusxalash";
                },
                2000
            );

        }
        catch{

            alert(code);

        }

    }
);


/* ==========================================
   SHARE
========================================== */

shareButton.addEventListener(
    "click",
    async ()=>{

        const link =
            generatedLink.textContent;

        const code =
            generatedCode.textContent;

        const shareText =
            "🔐 SafeStream video\n\n" +
            "🔑 Bir martalik kod: " +
            code +
            "\n\n" +
            link;


        if(
            navigator.share
        ){

            try{

                await navigator.share({
                    title:"SafeStream video",
                    text:shareText,
                    url:link
                });

            }
            catch(error){

                console.log(
                    "Ulashish bekor qilindi."
                );

            }

        }
        else{

            try{

                await navigator.clipboard
                    .writeText(
                        shareText
                    );

                shareButton.textContent =
                    "✅ Ulashish matni nusxalandi";

                setTimeout(
                    ()=>{
                        shareButton.textContent =
                            "📤 Ulashish";
                    },
                    2500
                );

            }
            catch{

                alert(shareText);

            }

        }

    }
);


/* ==========================================
   OPEN
========================================== */

openButton.addEventListener(
    "click",
    ()=>{

        const link =
            generatedLink.textContent;

        if(link){

            window.open(
                link,
                "_blank"
            );

        }

    }
);


/* ==========================================
   DOWNLOAD QR
========================================== */

downloadQR.addEventListener(
    "click",
    ()=>{

        const canvas =
            qrcode.querySelector("canvas");

        if(!canvas){

            alert(
                "QR kod hali tayyor emas."
            );

            return;
        }

        const link =
            document.createElement("a");

        link.download =
            "safestream-qr.png";

        link.href =
            canvas.toDataURL(
                "image/png"
            );

        link.click();

    }
);


/* ==========================================
   AUTH STATE
========================================== */

supabaseClient.auth
.onAuthStateChange(
    async (event,session)=>{

        if(session){

            await checkAdmin(
                session.user
            );

        }
        else{

            showLogin();

        }

    }
);


/* ==========================================
   START
========================================== */

async function start(){

    const {
        data
    } =
    await supabaseClient.auth
        .getSession();

    if(data.session){

        await checkAdmin(
            data.session.user
        );

    }
    else{

        showLogin();

    }

}

start();

</script>

</body>
</html>
