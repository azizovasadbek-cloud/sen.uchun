<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeStream Admin</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
.admin-card{
    max-width:600px;
    margin:40px auto;
    padding:28px;
    background:#10151f;
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;
    margin-bottom:8px;
    color:#aeb7c7;
}

.field input{
    width:100%;
    box-sizing:border-box;
    padding:13px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.1);
    background:#080b12;
    color:white;
}

.upload-button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:600;
}

.upload-button:disabled{
    opacity:.6;
}

#statusMessage{
    display:none;
    margin-top:18px;
    padding:14px;
    border-radius:10px;
    background:rgba(37,99,235,.12);
    color:#9bbcff;
    text-align:center;
}

#result{
    display:none;
    margin-top:25px;
    padding:20px;
    border-radius:15px;
    background:rgba(255,255,255,.04);
}

#result.show{
    display:block;
}

#generatedLink{
    width:100%;
    box-sizing:border-box;
    padding:11px;
    margin:12px 0;
    border-radius:9px;
    background:#080b12;
    color:#9ca5b5;
}

.copy-button{
    width:100%;
    padding:11px;
    border:0;
    border-radius:9px;
    background:rgba(37,99,235,.15);
    color:#8bb1ff;
}

#qrcode{
    width:max-content;
    margin:20px auto 0;
    padding:12px;
    background:white;
    border-radius:12px;
}

.video-info{
    margin-top:15px;
    text-align:center;
    color:#7e8797;
    font-size:13px;
}
</style>
</head>

<body>

<header class="navbar">
    <div class="logo">
        <span class="logo-icon">▶</span>
        SafeStream Admin
    </div>

    <div class="status">
        <span class="status-dot"></span>
        Admin
    </div>
</header>

<main class="container">

<div class="admin-card">

<h1>🎬 Video yuklash</h1>

<p>
Video tanlang. Yuklash tugagach avtomatik link va QR kod olinadi.
</p>

<div class="field">
<label for="videoName">Video nomi</label>

<input
    id="videoName"
    type="text"
    placeholder="Masalan: Sen uchun ❤️">
</div>

<div class="field">
<label for="videoFile">Video fayli</label>

<input
    id="videoFile"
    type="file"
    accept="video/*">
</div>

<button
    id="uploadButton"
    class="upload-button"
    onclick="uploadVideo()">

⬆️ Videoni yuklash

</button>

<div id="statusMessage"></div>

<div id="result">

<strong>✅ Video tayyor!</strong>

<input
    id="generatedLink"
    readonly>

<button
    class="copy-button"
    onclick="copyLink()">

🔗 Linkni nusxalash

</button>

<div id="qrcode"></div>

<div
    id="videoInfo"
    class="video-info">
</div>

</div>

</div>

</main>

<footer>
<span>SafeStream</span>
<span>•</span>
<span>Private & Secure</span>
</footer>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://kvwcvlwpdsixpbftoalh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_JyI5Zj_1ScRJ2-YEwdSDGg_eaTFvZuD";

const PROJECT_ID =
"kvwcvlwpdsixpbftoalh";

const BUCKET =
"videos";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ================================
   ID
================================ */

function generateId(){

    const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";

    let id="";

    for(let i=0;i<10;i++){

        id += chars.charAt(
            Math.floor(
                Math.random()*chars.length
            )
        );
    }

    return id;
}


/* ================================
   UPLOAD
================================ */

async function uploadVideo(){

    const name =
        document
        .getElementById("videoName")
        .value
        .trim();

    const file =
        document
        .getElementById("videoFile")
        .files[0];

    const button =
        document
        .getElementById("uploadButton");

    const status =
        document
        .getElementById("statusMessage");


    if(!name){

        alert("Video nomini kiriting.");
        return;
    }


    if(!file){

        alert("Video faylini tanlang.");
        return;
    }


    if(!file.type.startsWith("video/")){

        alert("Faqat video fayl tanlang.");
        return;
    }


    /* Free plan limit */

    const MAX_SIZE =
        50 * 1024 * 1024;


    if(file.size > MAX_SIZE){

        alert(
            "Bu video 50 MB dan katta.\n\n" +
            "Supabase Free rejimida bitta fayl 50 MB gacha."
        );

        return;
    }


    button.disabled=true;

    button.textContent=
        "⏳ Yuklanmoqda...";

    status.style.display="block";

    try{

        const videoId =
            generateId();


        let extension="mp4";

        if(file.name.includes(".")){

            extension =
                file.name
                .split(".")
                .pop()
                .toLowerCase();
        }


        const filePath =
            videoId + "." + extension;


        status.textContent =
            "⬆️ Video yuklanmoqda... 0%";


        /* ============================
           TUS
        ============================ */

        await new Promise(
            (resolve,reject)=>{

                const upload =
                    new tus.Upload(
                        file,
                        {

                        endpoint:
                        `https://${PROJECT_ID}.storage.supabase.co/storage/v1/upload/resumable`,

                        headers:{
                            authorization:
                            `Bearer ${SUPABASE_KEY}`,

                            apikey:
                            SUPABASE_KEY
                        },

                        metadata:{

                            bucketName:
                            BUCKET,

                            objectName:
                            filePath,

                            contentType:
                            file.type,

                            cacheControl:
                            "3600"
                        },

                        chunkSize:
                        6 * 1024 * 1024,

                        uploadDataDuringCreation:
                        true,

                        removeFingerprintOnSuccess:
                        true,

                        retryDelays:[
                            0,
                            3000,
                            5000,
                            10000,
                            20000
                        ],

                        onError(error){

                            console.error(error);

                            reject(error);
                        },

                        onProgress(
                            uploaded,
                            total
                        ){

                            const percent =
                                Math.round(
                                    uploaded /
                                    total *
                                    100
                                );

                            status.textContent =
                                `⬆️ Video yuklanmoqda... ${percent}%`;
                        },

                        onSuccess(){

                            resolve();
                        }

                    });


                upload.start();

            }
        );


        /* ============================
           DATABASE
        ============================ */

        status.textContent =
            "✅ Video saqlandi. Ma'lumot yozilmoqda...";


        const database =
            await supabaseClient
            .from("videos")
            .insert({

                title:name,

                file_path:filePath

            });


        if(database.error){

            throw database.error;
        }


        /* ============================
           LINK
        ============================ */

        const baseUrl =
            window.location.origin +
            window.location.pathname
            .replace(
                "admin.html",
                "index.html"
            );


        const uniqueLink =
            baseUrl +
            "?video=" +
            encodeURIComponent(
                videoId
            );


        document
        .getElementById(
            "generatedLink"
        )
        .value =
            uniqueLink;


        /* ============================
           QR
        ============================ */

        const qr =
            document
            .getElementById("qrcode");

        qr.innerHTML="";


        new QRCode(
            qr,
            {
                text:uniqueLink,
                width:180,
                height:180,
                colorDark:"#000000",
                colorLight:"#ffffff",
                correctLevel:
                    QRCode.CorrectLevel.H
            }
        );


        document
        .getElementById(
            "videoInfo"
        )
        .textContent =
            name +
            " • ID: " +
            videoId;


        document
        .getElementById("result")
        .classList.add("show");


        status.textContent =
            "✅ Hammasi tayyor!";


    }
    catch(error){

        console.error(error);

        status.textContent =
            "❌ Xatolik yuz berdi.";

        alert(
            "Xatolik:\n\n" +
            error.message
        );

    }
    finally{

        button.disabled=false;

        button.textContent =
            "⬆️ Videoni yuklash";
    }
}


/* ================================
   COPY
================================ */

async function copyLink(){

    const input =
        document
        .getElementById(
            "generatedLink"
        );

    try{

        await navigator
        .clipboard
        .writeText(
            input.value
        );

        alert("Link nusxalandi!");

    }
    catch(error){

        input.select();

        document.execCommand(
            "copy"
        );

        alert("Link nusxalandi!");
    }
}

</script>

</body>
</html>
