<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faqat sen uchun ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="box">

        <div class="heart">
            ❤️
        </div>

        <h1>
            Faqat sen uchun
        </h1>

        <p>
            Bu kichik sahifa aynan sen uchun tayyorlandi.
        </p>

        <p>
            Senga atalgan kichik bir video bor... 💕
        </p>

        <button onclick="showVideo()">
            Videoni ochish ❤️
        </button>

        <div id="videoBox" style="display: none; margin-top: 25px;">

            <video
                controls
                playsinline
                style="width: 100%; max-width: 500px; border-radius: 15px;">
                
                <source src="video.mp4" type="video/mp4">

                Brauzeringiz videoni qo‘llab-quvvatlamaydi.
            </video>

        </div>

    </div>

    <script>
        function showVideo() {
            document.getElementById("videoBox").style.display = "block";
        }
    </script>

</body>

</html>
