<!DOCTYPE html>
<html lang="uz">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SafeStream Admin</title>

    <link
        rel="stylesheet"
        href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>

        .admin-card {
            max-width: 600px;
            margin: 0 auto;
            padding: 28px;

            background: #10151f;

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 20px;
        }

        .admin-card h1 {
            margin-bottom: 10px;
        }

        .admin-description {
            color: #8f99aa;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;

            color: #aeb7c7;
            font-size: 13px;
        }

        .field input {
            width: 100%;
            box-sizing: border-box;

            padding: 13px 14px;

            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 10px;

            background: #080b12;
            color: white;

            outline: none;
        }

        .field input[type="file"] {
            padding: 10px;
        }

        .upload-button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 11px;

            background: #2563eb;
            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
        }

        .upload-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .progress {
            display: none;

            margin-top: 18px;

            padding: 14px;

            border-radius: 10px;

            background: rgba(37,99,235,0.10);

            color: #8eb3ff;

            text-align: center;
        }

        .result {
            display: none;

            margin-top: 25px;

            padding: 20px;

            border-radius: 14px;

            background: rgba(255,255,255,0.03);

            border: 1px solid rgba(255,255,255,0.07);
        }

        .result.visible {
            display: block;
        }

        .result-title {
            font-size: 16px;
            font-weight: 600;

            margin-bottom: 15px;
        }
